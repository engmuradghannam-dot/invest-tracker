<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المشاريع الاستثمارية</title>
<style>
:root {
  --navy-900: #0f1729; --navy-800: #1a2340; --navy-700: #263356; --navy-600: #36446b;
  --gold-500: #c9a961; --gold-400: #d9bd7e; --gold-600: #a68843;
  --paper: #f7f5f0; --surface: #ffffff; --line: #e2ddd2;
  --ink: #1a2340; --ink-soft: #5a6280; --ink-faint: #8b91a6;
  --ok: #2f7d5e; --warn: #b8860b; --danger: #a63d40;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
  --font: "Segoe UI", Tahoma, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--paper); color: var(--ink); line-height: 1.6; }
.app { display: flex; min-height: 100vh; }
.sidebar { width: 260px; background: var(--navy-800); color: #fff; padding: 24px; position: fixed; height: 100vh; }
.brand { margin-bottom: 32px; }
.brand h1 { font-size: 20px; font-weight: 700; }
.brand span { font-size: 12px; color: var(--gold-400); }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav-link { padding: 10px 14px; border-radius: var(--r-md); color: #cbd5e1; text-decoration: none; font-size: 14px; transition: .2s; }
.nav-link:hover, .nav-link.active { background: var(--navy-700); color: #fff; }
.main { flex: 1; margin-right: 260px; padding: 32px; max-width: 1200px; }
.page-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.page-head h2 { font-size: 22px; }
.page-head p { font-size: 13px; color: var(--ink-soft); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; margin-bottom: 20px; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; }
.stat.accent { border-top: 3px solid var(--gold-500); }
.stat-label { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
.stat-value { font-size: 24px; font-weight: 700; }
.stat-sub { font-size: 12px; color: var(--ink-faint); margin-top: 4px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: var(--r-md); font-size: 14px; font-weight: 500; cursor: pointer; border: none; background: var(--navy-800); color: #fff; }
.btn.gold { background: var(--gold-500); color: var(--navy-900); }
.btn.ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
.btn.danger { background: var(--danger); color: #fff; }
.btn.sm { padding: 6px 12px; font-size: 12px; }
.btn:hover { opacity: .9; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 12px; text-align: right; border-bottom: 1px solid var(--line); }
th { font-weight: 600; font-size: 13px; color: var(--ink-soft); }
tbody tr:hover { background: rgba(0,0,0,.02); }
.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
.badge.paid { background: #e8f5e9; color: var(--ok); }
.badge.pending { background: #fff3e0; color: var(--warn); }
.badge.due { background: #ffebee; color: var(--danger); }
.badge.partial { background: #e3f2fd; color: #1565c0; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-md); font-family: var(--font); font-size: 14px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold-500); }
.due-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.due-row:last-child { border-bottom: none; }
.progress-bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 8px; }
.progress-bar > div { height: 100%; background: var(--gold-500); border-radius: 4px; transition: width .3s; }
.empty { text-align: center; padding: 60px 20px; color: var(--ink-faint); }
.empty p { font-size: 15px; }
.num { font-variant-numeric: tabular-nums; }

/* Modal */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
.modal-overlay.active { display: flex; }
.modal { background: var(--surface); border-radius: var(--r-lg); padding: 24px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
.modal h3 { margin-bottom: 16px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

/* Toast */
.toast { position: fixed; top: 20px; left: 20px; padding: 12px 20px; border-radius: var(--r-md); color: #fff; font-size: 14px; z-index: 2000; animation: slideIn .3s ease; }
.toast.success { background: var(--ok); }
.toast.error { background: var(--danger); }
@keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* Action buttons in table */
.actions { display: flex; gap: 4px; }
.actions button { padding: 4px 8px; font-size: 11px; border-radius: var(--r-sm); border: none; cursor: pointer; }
.actions .edit-btn { background: #e3f2fd; color: #1565c0; }
.actions .delete-btn { background: #ffebee; color: var(--danger); }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>المشاريع الاستثمارية</h1>
      <span>متابعة الأرباح والاستحقاقات</span>
    </div>
    <nav class="nav">
      <a href="#" class="nav-link active" data-page="dashboard">لوحة المتابعة</a>
      <a href="#" class="nav-link" data-page="dues">الاستحقاقات</a>
      <a href="#" class="nav-link" data-page="projects">المشاريع</a>
      <a href="#" class="nav-link" data-page="partners">الشركاء</a>
    </nav>
  </aside>

  <main class="main" id="main"></main>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <h3>تأكيد الحذف</h3>
    <p>هل أنت متأكد من حذف هذا المشروع؟ لا يمكن التراجع عن هذا الإجراء.</p>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeDeleteModal()">إلغاء</button>
      <button class="btn danger" id="confirmDeleteBtn" onclick="confirmDelete()">حذف</button>
    </div>
  </div>
</div>

<!-- Edit Project Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>تعديل المشروع</h3>
    <div class="form-grid" style="margin-top:16px">
      <div><label>اسم المشروع *</label><input id="edit-name" placeholder="اسم المشروع"></div>
      <div><label>الشريك</label><select id="edit-partner"></select></div>
      <div><label>رأس المال (دينار)</label><input id="edit-capital" type="number" step="0.01"></div>
      <div><label>نسبة الربح (%)</label><input id="edit-rate" type="number" step="0.1"></div>
      <div><label>الدورة</label>
        <select id="edit-cycle">
          <option value="MONTHLY">شهري</option>
          <option value="QUARTERLY">ربع سنوي</option>
          <option value="SEMIANNUAL">نصف سنوي</option>
          <option value="ANNUAL">سنوي</option>
        </select>
      </div>
      <div><label>تاريخ البدء</label><input id="edit-start" type="date"></div>
      <div><label>تاريخ الانتهاء</label><input id="edit-end" type="date"></div>
      <div><label>الحالة</label>
        <select id="edit-status">
          <option value="ACTIVE">نشط</option>
          <option value="COMPLETED">منتهي</option>
          <option value="SUSPENDED">متعثر</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeEditModal()">إلغاء</button>
      <button class="btn gold" onclick="saveEditProject()">حفظ التعديلات</button>
    </div>
  </div>
</div>

<script>
const AUTH_HEADER = "Basic " + btoa("admin:ghannam2020");

async function req(path, opts = {}) {
  const res = await fetch("/api" + path, {
    headers: { "Content-Type": "application/json", "Authorization": AUTH_HEADER },
    ...opts,
  });
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || "خطأ");
    err.fields = data.fields;
    throw err;
  }
  return data;
}

const api = {
  dashboard: () => req("/dashboard"),
  partners: () => req("/partners"),
  addPartner: (b) => req("/partners", { method: "POST", body: JSON.stringify(b) }),
  projects: () => req("/projects"),
  project: (id) => req(`/projects/${id}`),
  addProject: (b) => req("/projects", { method: "POST", body: JSON.stringify(b) }),
  editProject: (id, b) => req(`/projects/${id}`, { method: "PUT", body: JSON.stringify(b) }),
  setStatus: (id, s) => req(`/projects/${id}/status`, { method: "PATCH", body: JSON.stringify({ status: s }) }),
  delProject: (id) => req(`/projects/${id}`, { method: "DELETE" }),
  dues: (d = 30) => req(`/dues?days=${d}`),
  addPayment: (b) => req("/payments", { method: "POST", body: JSON.stringify(b) }),
  delPayment: (id) => req(`/payments/${id}`, { method: "DELETE" }),
};

function money(fils) {
  if (!fils) return "0 دينار";
  const dinars = (BigInt(fils) / 1000n).toString();
  const rem = (BigInt(fils) % 1000n).toString().padStart(3, '0');
  return `${dinars}.${rem} دينار`;
}

function moneyShort(fils) {
  if (!fils) return "0";
  const v = Number(BigInt(fils));
  if (v >= 1_000_000) return (v / 1_000_000).toFixed(1) + "M";
  if (v >= 1_000) return (v / 1_000).toFixed(1) + "K";
  return v.toString();
}

function date(d) {
  if (!d) return "—";
  return new Date(d).toLocaleDateString('ar-JO');
}

function daysUntil(d) {
  return Math.ceil((new Date(d) - new Date()) / 86400000);
}

const STATUS = { PENDING: { label: "معلق", cls: "pending" }, DUE: { label: "مستحق", cls: "due" }, PARTIAL: { label: "جزئي", cls: "partial" }, PAID: { label: "مسدد", cls: "paid" } };
const CYCLES = { MONTHLY: "شهري", QUARTERLY: "ربع سنوي", SEMIANNUAL: "نصف سنوي", ANNUAL: "سنوي" };
const PROJECT_STATUS = { ACTIVE: { label: "نشط", cls: "paid" }, COMPLETED: { label: "منتهي", cls: "pending" }, SUSPENDED: { label: "متعثر", cls: "due" } };

// ── Routing ──
let currentPage = 'dashboard';
let currentProjectId = null;
let deleteTargetId = null;
let editTargetId = null;

function navigate(page, id = null) {
  currentPage = page;
  currentProjectId = id;
  document.querySelectorAll('.nav-link').forEach(a => a.classList.toggle('active', a.dataset.page === page));
  render();
}

document.querySelectorAll('.nav-link').forEach(a => {
  a.addEventListener('click', (e) => { e.preventDefault(); navigate(a.dataset.page); });
});

function showToast(msg, type = 'success') {
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ── Render ──
async function render() {
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty"><p>جارٍ التحميل…</p></div>';
  try {
    if (currentPage === 'dashboard') await renderDashboard(main);
    else if (currentPage === 'projects') await renderProjects(main);
    else if (currentPage === 'project') await renderProjectDetail(main, currentProjectId);
    else if (currentPage === 'dues') await renderDues(main);
    else if (currentPage === 'partners') await renderPartners(main);
  } catch (e) {
    main.innerHTML = `<div class="card"><p style="color:var(--danger)">${e.message}</p></div>`;
  }
}

async function renderDashboard(el) {
  const [stats, dues] = await Promise.all([api.dashboard(), api.dues(30)]);
  const collected = Number(BigInt(stats.scheduledFils || 0)) ? Number(BigInt(stats.paidFils || 0)) / Number(BigInt(stats.scheduledFils || 1)) * 100 : 0;
  el.innerHTML = `
    <div class="page-head"><div><h2>لوحة المتابعة</h2><p>${stats.activeCount} مشروع نشط من أصل ${stats.projectCount}</p></div></div>
    <div class="stat-grid">
      <div class="stat accent"><div class="stat-label">رأس المال المستثمر</div><div class="stat-value">${moneyShort(stats.capitalFils)}</div><div class="stat-sub">المشاريع النشطة فقط</div></div>
      <div class="stat"><div class="stat-label">إجمالي المستحقات</div><div class="stat-value">${moneyShort(stats.scheduledFils)}</div><div class="stat-sub">أرباح ورد رأس مال</div></div>
      <div class="stat"><div class="stat-label">المُحصّل</div><div class="stat-value">${moneyShort(stats.paidFils)}</div><div class="stat-sub">${collected.toFixed(1)}% من المستحقات</div></div>
      <div class="stat"><div class="stat-label">متأخرات</div><div class="stat-value">${stats.overdueCount}</div><div class="stat-sub">دفعة متأخرة</div></div>
    </div>
    <h3 style="margin:24px 0 16px">استحقاقات قادمة (٣٠ يوم)</h3>
    <div class="card">${dues.length === 0 ? '<div class="empty"><p>لا استحقاقات قادمة</p></div>' : dues.map(d => { const s = STATUS[d.status] || STATUS.PENDING; const days = daysUntil(d.dueDate); return `<div class="due-row"><div><div style="font-weight:600">${d.project?.name || '—'}</div><div style="font-size:13px;color:var(--ink-soft)">${date(d.dueDate)} · ${days > 0 ? 'بعد ' + days + ' يوم' : days === 0 ? 'اليوم' : 'متأخر ' + Math.abs(days) + ' يوم'}</div></div><div style="text-align:left"><div class="num" style="font-weight:600">${money(d.amountFils)}</div><span class="badge ${s.cls}">${s.label}</span></div></div>`; }).join('')}</div>
  `;
}

async function renderProjects(el) {
  const [projects, partners] = await Promise.all([api.projects(), api.partners()]);
  el.innerHTML = `
    <div class="page-head"><div><h2>المشاريع</h2><p>${projects.length} مشروع</p></div><button class="btn gold" onclick="showAddProject()">مشروع جديد</button></div>
    <div id="project-form" style="display:none" class="card" style="margin-bottom:20px">
      <h3>مشروع جديد</h3>
      <div class="form-grid" style="margin-top:16px">
        <div><label>اسم المشروع</label><input id="p-name" placeholder="اسم المشروع"></div>
        <div><label>الشريك</label><select id="p-partner">${partners.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}</select></div>
        <div><label>رأس المال (دينار)</label><input id="p-capital" type="number" step="0.01" placeholder="10000"></div>
        <div><label>نسبة الربح (%)</label><input id="p-rate" type="number" step="0.1" placeholder="7.5"></div>
        <div><label>الدورة</label><select id="p-cycle"><option value="MONTHLY">شهري</option><option value="QUARTERLY">ربع سنوي</option><option value="SEMIANNUAL">نصف سنوي</option><option value="ANNUAL">سنوي</option></select></div>
        <div><label>تاريخ البدء</label><input id="p-start" type="date"></div>
        <div><label>تاريخ الانتهاء (اختياري)</label><input id="p-end" type="date"></div>
      </div>
      <div style="margin-top:16px;display:flex;gap:8px"><button class="btn" onclick="saveProject()">حفظ</button><button class="btn ghost" onclick="hideAddProject()">إلغاء</button></div>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>المشروع</th><th>الشريك</th><th>رأس المال</th><th>الدورة</th><th>الحالة</th><th>المحصّل</th><th>إجراءات</th></tr></thead>
        <tbody>${projects.map(p => { const s = PROJECT_STATUS[p.status] || PROJECT_STATUS.ACTIVE; const sum = p.summary || {}; return `<tr><td><strong>${p.name}</strong></td><td>${p.partner?.name || '—'}</td><td class="num">${money(p.capitalFils)}</td><td>${CYCLES[p.cycle] || p.cycle}</td><td><span class="badge ${s.cls}">${s.label}</span></td><td><div class="num">${(sum.collectionPct || 0).toFixed(0)}%</div><div class="progress-bar"><div style="width:${sum.collectionPct || 0}%"></div></div></td><td><div class="actions"><button class="edit-btn" onclick="openEditModal('${p.id}')">تعديل</button><button class="delete-btn" onclick="openDeleteModal('${p.id}')">حذف</button></div></td></tr>`; }).join('')}</tbody>
      </table>
      ${projects.length === 0 ? '<div class="empty"><p>لا مشاريع مسجلة</p></div>' : ''}
    </div>
  `;
}

async function renderProjectDetail(el, id) {
  const p = await api.project(id);
  el.innerHTML = `
    <div class="page-head"><div><h2>${p.name}</h2><p>${p.partner?.name || '—'} · ${CYCLES[p.cycle] || p.cycle} · ${money(p.capitalFils)}</p></div>
      <div style="display:flex;gap:8px">
        <button class="btn" onclick="openEditModal('${p.id}')">تعديل</button>
        <button class="btn danger" onclick="openDeleteModal('${p.id}')">حذف المشروع</button>
        <button class="btn ghost" onclick="navigate('projects')">رجوع</button>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat accent"><div class="stat-label">رأس المال</div><div class="stat-value">${moneyShort(p.capitalFils)}</div></div>
      <div class="stat"><div class="stat-label">المستحقات</div><div class="stat-value">${moneyShort(p.summary?.scheduledFils || 0)}</div></div>
      <div class="stat"><div class="stat-label">المُحصّل</div><div class="stat-value">${moneyShort(p.summary?.paidFils || 0)}</div></div>
      <div class="stat"><div class="stat-label">المتبقي</div><div class="stat-value">${moneyShort(p.summary?.remainingFils || 0)}</div></div>
    </div>
    <h3 style="margin:24px 0 16px">جدول الاستحقاقات</h3>
    <div class="card">${p.dues?.length === 0 ? '<div class="empty"><p>لا استحقاقات</p></div>' : p.dues.map(d => { const s = STATUS[d.status] || STATUS.PENDING; return `<div class="due-row"><div><div style="font-weight:600">${d.kind === 'PROFIT' ? 'ربح' : 'رد رأس مال'} #${d.seq}</div><div style="font-size:13px;color:var(--ink-soft)">${date(d.dueDate)}</div></div><div style="text-align:left"><div class="num" style="font-weight:600">${money(d.amountFils)}</div><span class="badge ${s.cls}">${s.label}</span>${d.status !== 'PAID' ? `<button class="btn sm" onclick="payDue('${d.id}', ${d.amountFils})">تسجيل دفع</button>` : ''}</div></div>`; }).join('')}</div>
    <h3 style="margin:24px 0 16px">الدفعات المسجلة</h3>
    <div class="card">${p.payments?.length === 0 ? '<div class="empty"><p>لا دفعات مسجلة</p></div>' : p.payments.map(pay => `<div class="due-row"><div><div style="font-weight:600">${money(pay.amountFils)}</div><div style="font-size:13px;color:var(--ink-soft)">${date(pay.paidAt)} · ${pay.method || '—'}</div></div><div><button class="btn sm ghost" onclick="delPayment('${pay.id}')">حذف</button></div></div>`).join('')}</div>
  `;
}

async function renderDues(el) {
  const dues = await api.dues(30);
  const total = dues.reduce((s, d) => s + BigInt(d.amountFils || 0), 0n);
  const late = dues.filter(d => daysUntil(d.dueDate) < 0);
  el.innerHTML = `
    <div class="page-head"><div><h2>الاستحقاقات</h2><p>${dues.length} دفعة بقيمة ${money(total.toString())}${late.length > 0 ? ' · ' + late.length + ' متأخرة' : ''}</p></div></div>
    <div class="card">${dues.length === 0 ? '<div class="empty"><p>لا استحقاقات قادمة</p></div>' : dues.map(d => { const s = STATUS[d.status] || STATUS.PENDING; const days = daysUntil(d.dueDate); return `<div class="due-row" style="cursor:pointer" onclick="navigate('project', '${d.project?.id}')"><div><div style="font-weight:600">${d.project?.name || '—'}</div><div style="font-size:13px;color:var(--ink-soft)">${d.partner?.name || '—'} · ${date(d.dueDate)} · ${days > 0 ? 'بعد ' + days + ' يوم' : days === 0 ? 'اليوم' : 'متأخر ' + Math.abs(days) + ' يوم'}</div></div><div style="text-align:left"><div class="num" style="font-weight:600">${money(d.amountFils)}</div><span class="badge ${s.cls}">${s.label}</span></div></div>`; }).join('')}</div>
  `;
}

async function renderPartners(el) {
  const partners = await api.partners();
  el.innerHTML = `
    <div class="page-head"><div><h2>الشركاء</h2><p>${partners.length} شريك</p></div><button class="btn gold" onclick="showAddPartner()">شريك جديد</button></div>
    <div id="partner-form" style="display:none;margin-bottom:20px" class="card">
      <h3>شريك جديد</h3>
      <div class="form-grid" style="margin-top:16px">
        <div><label>الاسم *</label><input id="pa-name" placeholder="اسم الشريك"></div>
        <div><label>الشركة</label><input id="pa-company" placeholder="اسم الشركة"></div>
        <div><label>الهاتف</label><input id="pa-phone" placeholder="رقم الهاتف"></div>
        <div><label>البريد</label><input id="pa-email" type="email" placeholder="email@example.com"></div>
      </div>
      <div style="margin-top:16px;display:flex;gap:8px"><button class="btn" onclick="savePartner()">حفظ</button><button class="btn ghost" onclick="hideAddPartner()">إلغاء</button></div>
    </div>
    <div class="card">${partners.length === 0 ? '<div class="empty"><p>لا شركاء مسجلين</p></div>' : partners.map(p => `<div class="due-row"><div><div style="font-weight:600">${p.name}</div><div style="font-size:13px;color:var(--ink-soft)">${p.company || '—'} · ${p.phone || '—'} · ${p.email || '—'}</div></div><div><span class="badge pending">${p._count?.projects || 0} مشروع</span></div></div>`).join('')}</div>
  `;
}

// ── Delete Modal ──
function openDeleteModal(id) {
  deleteTargetId = id;
  document.getElementById('deleteModal').classList.add('active');
}
function closeDeleteModal() {
  deleteTargetId = null;
  document.getElementById('deleteModal').classList.remove('active');
}
async function confirmDelete() {
  if (!deleteTargetId) return;
  try {
    await api.delProject(deleteTargetId);
    showToast('تم حذف المشروع بنجاح');
    closeDeleteModal();
    if (currentPage === 'project') navigate('projects');
    else render();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

// ── Edit Modal ──
async function openEditModal(id) {
  editTargetId = id;
  try {
    const p = await api.project(id);
    const partners = await api.partners();

    document.getElementById('edit-name').value = p.name || '';
    document.getElementById('edit-partner').innerHTML = partners.map(pa => `<option value="${pa.id}" ${pa.id === p.partnerId ? 'selected' : ''}>${pa.name}</option>`).join('');
    document.getElementById('edit-capital').value = (Number(BigInt(p.capitalFils || 0)) / 1000).toFixed(3);
    document.getElementById('edit-rate').value = ((p.profitRateBp || 0) / 100).toFixed(2);
    document.getElementById('edit-cycle').value = p.cycle || 'MONTHLY';
    document.getElementById('edit-start').value = p.startDate ? new Date(p.startDate).toISOString().split('T')[0] : '';
    document.getElementById('edit-end').value = p.endDate ? new Date(p.endDate).toISOString().split('T')[0] : '';
    document.getElementById('edit-status').value = p.status || 'ACTIVE';

    document.getElementById('editModal').classList.add('active');
  } catch (e) {
    showToast(e.message, 'error');
  }
}
function closeEditModal() {
  editTargetId = null;
  document.getElementById('editModal').classList.remove('active');
}
async function saveEditProject() {
  if (!editTargetId) return;
  const body = {
    name: document.getElementById('edit-name').value,
    partnerId: document.getElementById('edit-partner').value,
    capital: parseFloat(document.getElementById('edit-capital').value),
    profitRatePct: parseFloat(document.getElementById('edit-rate').value),
    cycle: document.getElementById('edit-cycle').value,
    startDate: document.getElementById('edit-start').value,
    endDate: document.getElementById('edit-end').value || null,
    status: document.getElementById('edit-status').value
  };
  try {
    await api.editProject(editTargetId, body);
    showToast('تم تعديل المشروع بنجاح');
    closeEditModal();
    if (currentPage === 'project') navigate('project', editTargetId);
    else render();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

// ── Actions ──
function showAddProject() { document.getElementById('project-form').style.display = 'block'; }
function hideAddProject() { document.getElementById('project-form').style.display = 'none'; }

async function saveProject() {
  const body = {
    name: document.getElementById('p-name').value,
    partnerId: document.getElementById('p-partner').value,
    capital: parseFloat(document.getElementById('p-capital').value),
    profitRatePct: parseFloat(document.getElementById('p-rate').value),
    cycle: document.getElementById('p-cycle').value,
    startDate: document.getElementById('p-start').value,
    endDate: document.getElementById('p-end').value || null,
  };
  try {
    await api.addProject(body);
    showToast('تم إضافة المشروع بنجاح');
    hideAddProject();
    renderProjects(document.getElementById('main'));
  } catch (e) { showToast(e.message, 'error'); }
}

function showAddPartner() { document.getElementById('partner-form').style.display = 'block'; }
function hideAddPartner() { document.getElementById('partner-form').style.display = 'none'; }

async function savePartner() {
  const body = {
    name: document.getElementById('pa-name').value,
    company: document.getElementById('pa-company').value || null,
    phone: document.getElementById('pa-phone').value || null,
    email: document.getElementById('pa-email').value || null,
  };
  try {
    await api.addPartner(body);
    showToast('تم إضافة الشريك بنجاح');
    hideAddPartner();
    renderPartners(document.getElementById('main'));
  } catch (e) { showToast(e.message, 'error'); }
}

async function payDue(dueId, amount) {
  const paid = prompt('المبلغ المدفوع (دينار):', (amount / 1000).toFixed(3));
  if (!paid) return;
  try {
    await api.addPayment({ projectId: currentProjectId, dueId, amount: parseFloat(paid) });
    showToast('تم تسجيل الدفع');
    navigate('project', currentProjectId);
  } catch (e) { showToast(e.message, 'error'); }
}

async function delPayment(id) {
  if (!confirm('حذف الدفعة؟')) return;
  try {
    await api.delPayment(id);
    showToast('تم حذف الدفعة');
    navigate('project', currentProjectId);
  } catch (e) { showToast(e.message, 'error'); }
}

// Close modals on overlay click
document.getElementById('deleteModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeDeleteModal(); });
document.getElementById('editModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeEditModal(); });

// ── Init ──
navigate('dashboard');
</script>
</body>
</html>
