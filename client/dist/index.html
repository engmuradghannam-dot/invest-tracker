<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المشاريع الاستثمارية</title>
<style>
:root {
  --navy-900: #0f1729;
  --navy-800: #1a2340;
  --navy-700: #263356;
  --navy-600: #36446b;

  --gold-500: #c9a961;
  --gold-400: #d9bd7e;
  --gold-600: #a68843;

  --paper: #f7f5f0;
  --surface: #ffffff;
  --line: #e2ddd2;

  --ink: #1a2340;
  --ink-soft: #5a6280;
  --ink-faint: #8b91a6;

  --ok: #2f7d5e;
  --warn: #b8860b;
  --danger: #a63d40;

  --r-sm: 4px;
  --r-md: 8px;
  --r-lg: 14px;

  --shadow: 0 1px 2px rgba(15, 23, 41, .06), 0 8px 24px rgba(15, 23, 41, .05);

  --font: "IBM Plex Sans Arabic", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font);
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

/* الأرقام دائماً LTR ومحاذاة يسار داخل نص عربي */
.num {
  font-family: var(--mono);
  direction: ltr;
  unicode-bidi: isolate;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* ── الهيكل ───────────────────────────────────── */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: 240px;
  flex-shrink: 0;
  background: var(--navy-800);
  color: #fff;
  padding: 28px 0;
  display: flex;
  flex-direction: column;
}

.brand {
  padding: 0 24px 24px;
  border-bottom: 1px solid rgba(201, 169, 97, .2);
  margin-bottom: 16px;
}
.brand h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.2px; }
.brand span { font-size: 12px; color: var(--gold-500); font-weight: 400; }

.nav a {
  display: block;
  padding: 11px 24px;
  color: rgba(255, 255, 255, .72);
  text-decoration: none;
  font-size: 14.5px;
  border-inline-start: 3px solid transparent;
  transition: background .15s, color .15s;
}
.nav a:hover { background: rgba(255, 255, 255, .05); color: #fff; }
.nav a.active {
  background: rgba(201, 169, 97, .12);
  border-inline-start-color: var(--gold-500);
  color: #fff;
  font-weight: 500;
}

.main { flex: 1; padding: 32px 40px; max-width: 1400px; min-width: 0; }

.page-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; margin-bottom: 24px; flex-wrap: wrap;
}
.page-head h2 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.4px; }
.page-head p { margin: 4px 0 0; color: var(--ink-soft); font-size: 14px; }

/* ── البطاقات ─────────────────────────────────── */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 14px; margin-bottom: 28px;
}

.stat {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px 20px;
}
.stat-label { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 8px; }
.stat-value { font-size: 22px; font-weight: 600; letter-spacing: -.5px; }
.stat-sub { font-size: 12px; color: var(--ink-faint); margin-top: 5px; }
.stat.accent { background: var(--navy-800); border-color: var(--navy-800); color: #fff; }
.stat.accent .stat-label { color: var(--gold-500); }
.stat.accent .stat-sub { color: rgba(255, 255, 255, .5); }
.stat.alert { border-color: rgba(166, 61, 64, .3); background: #fdf8f8; }
.stat.alert .stat-value { color: var(--danger); }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  overflow: hidden;
  margin-bottom: 20px;
}
.card-head {
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.card-head h3 { margin: 0; font-size: 15.5px; font-weight: 600; }
.card-body { padding: 20px; }

/* ── الجداول ──────────────────────────────────── */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
thead th {
  text-align: right;
  padding: 11px 20px;
  font-size: 12px; font-weight: 600;
  color: var(--ink-soft);
  background: #faf9f6;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
tbody td { padding: 13px 20px; border-bottom: 1px solid #f0ece3; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: #fbfaf7; }
td.ltr { text-align: left; }

/* ── العناصر ──────────────────────────────────── */
.badge {
  display: inline-block; padding: 3px 9px;
  border-radius: 20px; font-size: 11.5px; font-weight: 500; white-space: nowrap;
}
.badge.paid    { background: #e6f2ec; color: var(--ok); }
.badge.due     { background: #fbeaea; color: var(--danger); }
.badge.partial { background: #fdf3e0; color: var(--warn); }
.badge.pending { background: #eef0f5; color: var(--ink-soft); }
.badge.gold    { background: rgba(201, 169, 97, .18); color: var(--gold-600); }

.btn {
  font-family: inherit; font-size: 14px; font-weight: 500;
  padding: 9px 18px; border-radius: var(--r-md);
  border: 1px solid var(--navy-800); background: var(--navy-800); color: #fff;
  cursor: pointer; transition: background .15s, transform .05s;
}
.btn:hover { background: var(--navy-700); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { background: #f2efe8; }
.btn.gold { background: var(--gold-500); border-color: var(--gold-500); color: var(--navy-900); }
.btn.gold:hover { background: var(--gold-400); }
.btn.sm { padding: 5px 12px; font-size: 12.5px; }
.btn:focus-visible { outline: 2px solid var(--gold-500); outline-offset: 2px; }

.field { margin-bottom: 15px; }
.field label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; font-family: inherit; font-size: 14px;
  padding: 9px 12px; border: 1px solid var(--line);
  border-radius: var(--r-md); background: #fff; color: var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--gold-500);
  box-shadow: 0 0 0 3px rgba(201, 169, 97, .15);
}
.field .hint { font-size: 12px; color: var(--ink-faint); margin-top: 5px; }
.field .err { font-size: 12.5px; color: var(--danger); margin-top: 5px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }

.modal-bg {
  position: fixed; inset: 0; background: rgba(15, 23, 41, .45);
  display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
}
.modal {
  background: var(--surface); border-radius: var(--r-lg);
  width: 100%; max-width: 540px; max-height: 90vh; overflow: auto; box-shadow: var(--shadow);
}
.modal-head {
  padding: 18px 22px; border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
}
.modal-head h3 { margin: 0; font-size: 17px; }
.modal-body { padding: 22px; }
.modal-foot {
  padding: 15px 22px; border-top: 1px solid var(--line);
  display: flex; gap: 10px; justify-content: flex-start; background: #faf9f6;
}

.empty { padding: 48px 24px; text-align: center; color: var(--ink-soft); }
.empty p { margin: 0 0 16px; font-size: 14.5px; }

.link { color: var(--navy-700); text-decoration: none; font-weight: 500; }
.link:hover { color: var(--gold-600); text-decoration: underline; }

.banner {
  padding: 12px 18px; border-radius: var(--r-md);
  font-size: 14px; margin-bottom: 18px;
}
.banner.error { background: #fbeaea; color: var(--danger); border: 1px solid rgba(166, 61, 64, .2); }

.progress {
  height: 5px; background: #eae6dc; border-radius: 3px; overflow: hidden; margin-top: 8px;
}
.progress > div { height: 100%; background: var(--gold-500); }

@media (max-width: 820px) {
  .app { flex-direction: column; }
  .sidebar { width: 100%; padding: 16px 0; }
  .nav { display: flex; overflow-x: auto; }
  .nav a { border-inline-start: none; border-bottom: 3px solid transparent; white-space: nowrap; }
  .nav a.active { border-inline-start: none; border-bottom-color: var(--gold-500); }
  .main { padding: 20px 16px; }
  .grid-2 { grid-template-columns: 1fr; }

  /* الجداول تُمرَّر أفقياً بدل أن تُقتطع أعمدتها اليسرى */
  .card { overflow-x: auto; }
  .card table { min-width: 620px; }
  thead th, tbody td { padding-inline: 12px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ── إضافات: التعديل والمرفقات ─────────────────── */
.head-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.status-select {
  font-family: inherit; font-size: 13.5px;
  padding: 8px 12px; border: 1px solid var(--line);
  border-radius: var(--r-md); background: #fff; color: var(--ink);
}
.status-select:focus {
  outline: none; border-color: var(--gold-500);
  box-shadow: 0 0 0 3px rgba(201, 169, 97, .15);
}

.banner.info {
  background: rgba(201, 169, 97, .12);
  color: var(--gold-600);
  border: 1px solid rgba(201, 169, 97, .3);
}

.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger:hover { background: #8f3336; }

.danger-zone { border-color: rgba(166, 61, 64, .25); }
.danger-zone .card-body {
  display: flex; justify-content: space-between;
  align-items: center; gap: 16px; flex-wrap: wrap;
}

.doc-list { list-style: none; margin: 0 0 10px; padding: 0; }
.doc-list li {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 0; font-size: 13px;
}
.doc-list li + li { border-top: 1px solid #f0ece3; }
.doc-list .link { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc-meta { font-size: 11.5px; color: var(--ink-faint); }

.field input[type="file"] {
  padding: 7px 10px; font-size: 13px; background: #faf9f6; cursor: pointer;
}

/* Additional styles for static app */
.page { display: none; }
.page.active { display: block; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 12px; text-align: right; border-bottom: 1px solid var(--line); }
th { font-weight: 600; font-size: 13px; color: var(--ink-soft); }
tbody tr:hover { background: rgba(0,0,0,.02); }
.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
.badge.paid { background: #e8f5e9; color: #2f7d5e; }
.badge.pending { background: #fff3e0; color: #b8860b; }
.badge.due { background: #ffebee; color: #a63d40; }
.badge.partial { background: #e3f2fd; color: #1565c0; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-md); font-family: var(--font); font-size: 14px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold-500); }
.tabs { display: flex; gap: 8px; margin-bottom: 20px; }
.tab { padding: 8px 16px; border-radius: var(--r-md); cursor: pointer; border: 1px solid var(--line); background: var(--surface); }
.tab.active { background: var(--navy-800); color: #fff; border-color: var(--navy-800); }
.due-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.due-row:last-child { border-bottom: none; }
.progress-bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-top: 8px; }
.progress-bar > div { height: 100%; background: var(--gold-500); border-radius: 4px; transition: width .3s; }
.empty { text-align: center; padding: 60px 20px; color: var(--ink-faint); }
.empty p { font-size: 15px; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>المشاريع الاستثمارية</h1>
      <span>متابعة الأرباح والاستحقاقات</span>
    </div>
    <nav class="nav">
      <a href="#" class="nav-link active" data-page="dashboard">لوحة المتابعة</a>
      <a href="#" class="nav-link" data-page="dues">الاستحقاقات</a>
      <a href="#" class="nav-link" data-page="projects">المشاريع</a>
      <a href="#" class="nav-link" data-page="partners">الشركاء</a>
    </nav>
  </aside>

  <main class="main" id="main">
    <!-- Pages will be rendered here -->
  </main>
</div>

<script>
const AUTH_HEADER = "Basic " + btoa("admin:ghannam2020");

async function req(path, opts = {}) {
  const res = await fetch("/api" + path, {
    headers: { "Content-Type": "application/json", "Authorization": AUTH_HEADER },
    ...opts,
  });
  if (res.status === 204) return null;
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "خطأ");
  return data;
}

const api = {
  dashboard: () => req("/dashboard"),
  partners: () => req("/partners"),
  addPartner: (b) => req("/partners", { method: "POST", body: JSON.stringify(b) }),
  projects: () => req("/projects"),
  project: (id) => req(`/projects/${id}`),
  addProject: (b) => req("/projects", { method: "POST", body: JSON.stringify(b) }),
  editProject: (id, b) => req(`/projects/${id}`, { method: "PUT", body: JSON.stringify(b) }),
  setStatus: (id, s) => req(`/projects/${id}/status`, { method: "PATCH", body: JSON.stringify({ status: s }) }),
  regenerate: (id) => req(`/projects/${id}/regenerate`, { method: "POST" }),
  delProject: (id) => req(`/projects/${id}`, { method: "DELETE" }),
  dues: (d = 30) => req(`/dues?days=${d}`),
  addPayment: (b) => req("/payments", { method: "POST", body: JSON.stringify(b) }),
  delPayment: (id) => req(`/payments/${id}`, { method: "DELETE" }),
};

function money(fils) {
  if (!fils) return "0 دينار";
  const dinars = (BigInt(fils) / 1000n).toString();
  const rem = (BigInt(fils) % 1000n).toString().padStart(3, '0');
  return `${dinars}.${rem} دينار`;
}

function moneyShort(fils) {
  if (!fils) return "0";
  const v = Number(BigInt(fils));
  if (v >= 1_000_000) return (v / 1_000_000).toFixed(1) + "M";
  if (v >= 1_000) return (v / 1_000).toFixed(1) + "K";
  return v.toString();
}

function date(d) {
  if (!d) return "—";
  return new Date(d).toLocaleDateString('ar-JO');
}

function daysUntil(d) {
  const diff = Math.ceil((new Date(d) - new Date()) / 86400000);
  return diff;
}

const STATUS = {
  PENDING: { label: "معلق", cls: "pending" },
  DUE: { label: "مستحق", cls: "due" },
  PARTIAL: { label: "جزئي", cls: "partial" },
  PAID: { label: "مسدد", cls: "paid" },
};

const CYCLES = {
  MONTHLY: "شهري",
  QUARTERLY: "ربع سنوي",
  SEMIANNUAL: "نصف سنوي",
  ANNUAL: "سنوي",
};

const PROJECT_STATUS = {
  ACTIVE: { label: "نشط", cls: "paid" },
  COMPLETED: { label: "منتهي", cls: "pending" },
  SUSPENDED: { label: "متعثر", cls: "due" },
};

// ── Routing ──
let currentPage = 'dashboard';
let currentProjectId = null;

function navigate(page, id = null) {
  currentPage = page;
  currentProjectId = id;
  document.querySelectorAll('.nav-link').forEach(a => {
    a.classList.toggle('active', a.dataset.page === page);
  });
  render();
}

document.querySelectorAll('.nav-link').forEach(a => {
  a.addEventListener('click', (e) => {
    e.preventDefault();
    navigate(a.dataset.page);
  });
});

// ── Render ──
async function render() {
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty"><p>جارٍ التحميل…</p></div>';

  try {
    if (currentPage === 'dashboard') await renderDashboard(main);
    else if (currentPage === 'projects') await renderProjects(main);
    else if (currentPage === 'project') await renderProjectDetail(main, currentProjectId);
    else if (currentPage === 'dues') await renderDues(main);
    else if (currentPage === 'partners') await renderPartners(main);
  } catch (e) {
    main.innerHTML = `<div class="banner error">${e.message}</div>`;
  }
}

async function renderDashboard(el) {
  const [stats, dues] = await Promise.all([api.dashboard(), api.dues(30)]);
  const collected = Number(BigInt(stats.scheduledFils || 0))
    ? Number(BigInt(stats.paidFils || 0)) / Number(BigInt(stats.scheduledFils || 1)) * 100
    : 0;

  el.innerHTML = `
    <div class="page-head">
      <div>
        <h2>لوحة المتابعة</h2>
        <p>${stats.activeCount} مشروع نشط من أصل ${stats.projectCount}</p>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat accent">
        <div class="stat-label">رأس المال المستثمر</div>
        <div class="stat-value">${moneyShort(stats.capitalFils)}</div>
        <div class="stat-sub">المشاريع النشطة فقط</div>
      </div>
      <div class="stat">
        <div class="stat-label">إجمالي المستحقات</div>
        <div class="stat-value">${moneyShort(stats.scheduledFils)}</div>
        <div class="stat-sub">أرباح ورد رأس مال</div>
      </div>
      <div class="stat">
        <div class="stat-label">المُحصّل</div>
        <div class="stat-value">${moneyShort(stats.paidFils)}</div>
        <div class="stat-sub">${collected.toFixed(1)}% من المستحقات</div>
      </div>
      <div class="stat">
        <div class="stat-label">متأخرات</div>
        <div class="stat-value">${stats.overdueCount}</div>
        <div class="stat-sub">دفعة متأخرة</div>
      </div>
    </div>

    <h3 style="margin: 24px 0 16px;">استحقاقات قادمة (٣٠ يوم)</h3>
    <div class="card">
      ${dues.length === 0 ? '<div class="empty"><p>لا استحقاقات قادمة</p></div>' :
        dues.map(d => {
          const s = STATUS[d.status] || STATUS.PENDING;
          const days = daysUntil(d.dueDate);
          return `
          <div class="due-row">
            <div>
              <div style="font-weight:600">${d.project.name}</div>
              <div style="font-size:13px;color:var(--ink-soft)">${date(d.dueDate)} · ${days > 0 ? 'بعد ' + days + ' يوم' : days === 0 ? 'اليوم' : 'متأخر ' + Math.abs(days) + ' يوم'}</div>
            </div>
            <div style="text-align:left">
              <div class="num" style="font-weight:600">${money(d.amountFils)}</div>
              <span class="badge ${s.cls}">${s.label}</span>
            </div>
          </div>`;
        }).join('')}
    </div>
  `;
}

async function renderProjects(el) {
  const [projects, partners] = await Promise.all([api.projects(), api.partners()]);

  el.innerHTML = `
    <div class="page-head">
      <div><h2>المشاريع</h2><p>${projects.length} مشروع</p></div>
      <button class="btn gold" onclick="showAddProject()">مشروع جديد</button>
    </div>
    <div id="project-form" style="display:none" class="card" style="margin-bottom:20px">
      <h3>مشروع جديد</h3>
      <div class="form-grid" style="margin-top:16px">
        <div><label>اسم المشروع</label><input id="p-name" placeholder="اسم المشروع"></div>
        <div><label>الشريك</label>
          <select id="p-partner">${partners.map(p => `<option value="${p.id}">${p.name}</option>`).join('')}</select>
        </div>
        <div><label>رأس المال (دينار)</label><input id="p-capital" type="number" step="0.01" placeholder="10000"></div>
        <div><label>نسبة الربح (%)</label><input id="p-rate" type="number" step="0.1" placeholder="7.5"></div>
        <div><label>الدورة</label>
          <select id="p-cycle">
            <option value="MONTHLY">شهري</option>
            <option value="QUARTERLY">ربع سنوي</option>
            <option value="SEMIANNUAL">نصف سنوي</option>
            <option value="ANNUAL">سنوي</option>
          </select>
        </div>
        <div><label>تاريخ البدء</label><input id="p-start" type="date"></div>
        <div><label>تاريخ الانتهاء (اختياري)</label><input id="p-end" type="date"></div>
      </div>
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn" onclick="saveProject()">حفظ</button>
        <button class="btn ghost" onclick="hideAddProject()">إلغاء</button>
      </div>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>المشروع</th><th>الشريك</th><th>رأس المال</th><th>الدورة</th><th>الحالة</th><th>المحصّل</th></tr></thead>
        <tbody>
          ${projects.map(p => {
            const s = PROJECT_STATUS[p.status] || PROJECT_STATUS.ACTIVE;
            const sum = p.summary || {};
            return `<tr style="cursor:pointer" onclick="navigate('project', '${p.id}')">
              <td><strong>${p.name}</strong></td>
              <td>${p.partner?.name || '—'}</td>
              <td class="num">${money(p.capitalFils)}</td>
              <td>${CYCLES[p.cycle] || p.cycle}</td>
              <td><span class="badge ${s.cls}">${s.label}</span></td>
              <td>
                <div class="num">${(sum.collectionPct || 0).toFixed(0)}%</div>
                <div class="progress-bar"><div style="width:${sum.collectionPct || 0}%"></div></div>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
      ${projects.length === 0 ? '<div class="empty"><p>لا مشاريع مسجلة</p></div>' : ''}
    </div>
  `;
}

async function renderProjectDetail(el, id) {
  const p = await api.project(id);
  const partners = await api.partners();

  el.innerHTML = `
    <div class="page-head">
      <div>
        <h2>${p.name}</h2>
        <p>${p.partner?.name || '—'} · ${CYCLES[p.cycle] || p.cycle} · ${money(p.capitalFils)}</p>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn" onclick="showEditProject()">تعديل</button>
        <button class="btn ghost" onclick="navigate('projects')">رجوع</button>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat accent"><div class="stat-label">رأس المال</div><div class="stat-value">${moneyShort(p.capitalFils)}</div></div>
      <div class="stat"><div class="stat-label">المستحقات</div><div class="stat-value">${moneyShort(p.summary?.scheduledFils || 0)}</div></div>
      <div class="stat"><div class="stat-label">المُحصّل</div><div class="stat-value">${moneyShort(p.summary?.paidFils || 0)}</div></div>
      <div class="stat"><div class="stat-label">المتبقي</div><div class="stat-value">${moneyShort(p.summary?.remainingFils || 0)}</div></div>
    </div>

    <h3 style="margin: 24px 0 16px;">جدول الاستحقاقات</h3>
    <div class="card">
      ${p.dues.length === 0 ? '<div class="empty"><p>لا استحقاقات</p></div>' :
        p.dues.map(d => {
          const s = STATUS[d.status] || STATUS.PENDING;
          return `
          <div class="due-row">
            <div>
              <div style="font-weight:600">${d.kind === 'PROFIT' ? 'ربح' : 'رد رأس مال'} #${d.seq}</div>
              <div style="font-size:13px;color:var(--ink-soft)">${date(d.dueDate)}</div>
            </div>
            <div style="text-align:left">
              <div class="num" style="font-weight:600">${money(d.amountFils)}</div>
              <span class="badge ${s.cls}">${s.label}</span>
              ${d.status !== 'PAID' ? `<button class="btn sm" onclick="payDue('${d.id}', ${d.amountFils})">تسجيل دفع</button>` : ''}
            </div>
          </div>`;
        }).join('')}
    </div>

    <h3 style="margin: 24px 0 16px;">الدفعات المسجلة</h3>
    <div class="card">
      ${p.payments.length === 0 ? '<div class="empty"><p>لا دفعات مسجلة</p></div>' :
        p.payments.map(pay => `
          <div class="due-row">
            <div>
              <div style="font-weight:600">${money(pay.amountFils)}</div>
              <div style="font-size:13px;color:var(--ink-soft)">${date(pay.paidAt)} · ${pay.method || '—'}</div>
            </div>
            <div>
              <button class="btn sm ghost" onclick="delPayment('${pay.id}')">حذف</button>
            </div>
          </div>
        `).join('')}
    </div>
  `;
}

async function renderDues(el) {
  const dues = await api.dues(30);
  const total = dues.reduce((s, d) => s + BigInt(d.amountFils || 0), 0n);
  const late = dues.filter(d => daysUntil(d.dueDate) < 0);

  el.innerHTML = `
    <div class="page-head">
      <div>
        <h2>الاستحقاقات</h2>
        <p>${dues.length} دفعة بقيمة ${money(total.toString())}${late.length > 0 ? ' · ' + late.length + ' متأخرة' : ''}</p>
      </div>
    </div>
    <div class="card">
      ${dues.length === 0 ? '<div class="empty"><p>لا استحقاقات قادمة</p></div>' :
        dues.map(d => {
          const s = STATUS[d.status] || STATUS.PENDING;
          const days = daysUntil(d.dueDate);
          return `
          <div class="due-row" style="cursor:pointer" onclick="navigate('project', '${d.project.id}')">
            <div>
              <div style="font-weight:600">${d.project.name}</div>
              <div style="font-size:13px;color:var(--ink-soft)">${d.partner.name} · ${date(d.dueDate)} · ${days > 0 ? 'بعد ' + days + ' يوم' : days === 0 ? 'اليوم' : 'متأخر ' + Math.abs(days) + ' يوم'}</div>
            </div>
            <div style="text-align:left">
              <div class="num" style="font-weight:600">${money(d.amountFils)}</div>
              <span class="badge ${s.cls}">${s.label}</span>
            </div>
          </div>`;
        }).join('')}
    </div>
  `;
}

async function renderPartners(el) {
  const partners = await api.partners();

  el.innerHTML = `
    <div class="page-head">
      <div><h2>الشركاء</h2><p>${partners.length} شريك</p></div>
      <button class="btn gold" onclick="showAddPartner()">شريك جديد</button>
    </div>
    <div id="partner-form" style="display:none;margin-bottom:20px" class="card">
      <h3>شريك جديد</h3>
      <div class="form-grid" style="margin-top:16px">
        <div><label>الاسم *</label><input id="pa-name" placeholder="اسم الشريك"></div>
        <div><label>الشركة</label><input id="pa-company" placeholder="اسم الشركة"></div>
        <div><label>الهاتف</label><input id="pa-phone" placeholder="رقم الهاتف"></div>
        <div><label>البريد</label><input id="pa-email" type="email" placeholder="email@example.com"></div>
      </div>
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn" onclick="savePartner()">حفظ</button>
        <button class="btn ghost" onclick="hideAddPartner()">إلغاء</button>
      </div>
    </div>
    <div class="card">
      ${partners.length === 0 ? '<div class="empty"><p>لا شركاء مسجلين</p></div>' :
        partners.map(p => `
          <div class="due-row">
            <div>
              <div style="font-weight:600">${p.name}</div>
              <div style="font-size:13px;color:var(--ink-soft)">${p.company || '—'} · ${p.phone || '—'} · ${p.email || '—'}</div>
            </div>
            <div><span class="badge pending">${p._count?.projects || 0} مشروع</span></div>
          </div>
        `).join('')}
    </div>
  `;
}

// ── Actions ──
function showAddProject() { document.getElementById('project-form').style.display = 'block'; }
function hideAddProject() { document.getElementById('project-form').style.display = 'none'; }

async function saveProject() {
  const body = {
    name: document.getElementById('p-name').value,
    partnerId: document.getElementById('p-partner').value,
    capital: parseFloat(document.getElementById('p-capital').value),
    profitRatePct: parseFloat(document.getElementById('p-rate').value),
    cycle: document.getElementById('p-cycle').value,
    startDate: document.getElementById('p-start').value,
    endDate: document.getElementById('p-end').value || null,
  };
  try {
    await api.addProject(body);
    hideAddProject();
    renderProjects(document.getElementById('main'));
  } catch (e) { alert(e.message); }
}

function showAddPartner() { document.getElementById('partner-form').style.display = 'block'; }
function hideAddPartner() { document.getElementById('partner-form').style.display = 'none'; }

async function savePartner() {
  const body = {
    name: document.getElementById('pa-name').value,
    company: document.getElementById('pa-company').value || null,
    phone: document.getElementById('pa-phone').value || null,
    email: document.getElementById('pa-email').value || null,
  };
  try {
    await api.addPartner(body);
    hideAddPartner();
    renderPartners(document.getElementById('main'));
  } catch (e) { alert(e.message); }
}

async function payDue(dueId, amount) {
  const projectId = currentProjectId;
  const paid = prompt('المبلغ المدفوع (دينار):', (amount / 1000).toFixed(3));
  if (!paid) return;
  try {
    await api.addPayment({ projectId, dueId, amount: parseFloat(paid) });
    navigate('project', projectId);
  } catch (e) { alert(e.message); }
}

async function delPayment(id) {
  if (!confirm('حذف الدفعة؟')) return;
  try {
    await api.delPayment(id);
    navigate('project', currentProjectId);
  } catch (e) { alert(e.message); }
}

// ── Init ──
navigate('dashboard');
</script>
</body>
