services:
  - type: web
    name: invest-tracker
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: invest-db
          property: connectionString
      - key: PORT
        value: 4000
      - key: UPLOAD_DIR
        value: ./uploads
      - key: OPEN_ENDED_CYCLES
        value: 24
      - key: AUTH_USER
        value: admin
      - key: AUTH_PASS
        generateValue: true
      - key: NODE_ENV
        value: production
    healthCheckPath: /health
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1

databases:
  - name: invest-db
    plan: free
    databaseName: invest_tracker
    user: invest_user
